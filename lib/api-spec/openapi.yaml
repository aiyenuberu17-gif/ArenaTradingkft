openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Marketplace product operations
  - name: about
    description: Public About page and admin content operations
  - name: businessDocuments
    description: Admin invoice, receipt, and shipping document operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List marketplace products
      responses:
        "200":
          description: Marketplace products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a marketplace product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created marketplace product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "401":
          description: Admin authentication required
  /products/{id}:
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a marketplace product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "401":
          description: Admin authentication required
        "404":
          description: Product not found
  /about:
    get:
      operationId: getAbout
      tags: [about]
      summary: Get the public About page
      responses:
        "200":
          description: About page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutPage"
    put:
      operationId: updateAbout
      tags: [about]
      summary: Update the About page hero content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutPageInput"
      responses:
        "200":
          description: Updated About page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutPage"
        "401":
          description: Admin authentication required
  /about/segments:
    post:
      operationId: createAboutSegment
      tags: [about]
      summary: Add an About page segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutSegmentInput"
      responses:
        "201":
          description: Created About segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutSegment"
        "401":
          description: Admin authentication required
  /about/segments/{id}:
    patch:
      operationId: updateAboutSegment
      tags: [about]
      summary: Edit an About page segment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutSegmentInput"
      responses:
        "200":
          description: Updated About segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutSegment"
        "401":
          description: Admin authentication required
        "404":
          description: About segment not found
    delete:
      operationId: deleteAboutSegment
      tags: [about]
      summary: Remove an About page segment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: About segment deleted
        "401":
          description: Admin authentication required
        "404":
          description: About segment not found
  /uploads/about-image:
    post:
      operationId: uploadAboutImage
      tags: [about]
      summary: Upload an About page image
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded About image
          content:
            application/json:
              schema:
                type: object
                required: [imagePath]
                properties:
                  imagePath:
                    type: string
        "400":
          description: Invalid or missing image
        "401":
          description: Admin authentication required
  /uploads/document-branding-image:
    post:
      operationId: uploadDocumentBrandingImage
      tags: [businessDocuments]
      summary: Upload a business document logo or stamp
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded document branding image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBrandingImage"
        "400":
          description: Invalid or missing image
        "401":
          description: Admin authentication required
  /admin/document-settings:
    get:
      operationId: getBusinessDocumentSettings
      tags: [businessDocuments]
      summary: Get business document branding and defaults
      responses:
        "200":
          description: Business document settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocumentSettings"
        "401":
          description: Admin authentication required
    put:
      operationId: updateBusinessDocumentSettings
      tags: [businessDocuments]
      summary: Save business document branding and defaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessDocumentSettingsInput"
      responses:
        "200":
          description: Updated business document settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocumentSettings"
        "400":
          description: Invalid settings
        "401":
          description: Admin authentication required
  /admin/business-documents:
    get:
      operationId: listBusinessDocuments
      tags: [businessDocuments]
      summary: List generated invoices, receipts, and shipping documents
      responses:
        "200":
          description: Generated business documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessDocument"
        "401":
          description: Admin authentication required
    post:
      operationId: createBusinessDocument
      tags: [businessDocuments]
      summary: Create a business document draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessDocumentInput"
      responses:
        "201":
          description: Created business document draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocument"
        "400":
          description: Invalid business document
        "401":
          description: Admin authentication required
  /admin/business-documents/{id}:
    patch:
      operationId: updateBusinessDocument
      tags: [businessDocuments]
      summary: Update a business document draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessDocumentInput"
      responses:
        "200":
          description: Updated business document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocument"
        "400":
          description: Invalid business document
        "401":
          description: Admin authentication required
        "404":
          description: Business document not found
        "409":
          description: Only drafts can be edited
    delete:
      operationId: deleteBusinessDocument
      tags: [businessDocuments]
      summary: Delete a business document draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Draft deleted
        "401":
          description: Admin authentication required
        "404":
          description: Business document not found
        "409":
          description: Only drafts can be deleted
  /admin/business-documents/{id}/status:
    patch:
      operationId: updateBusinessDocumentStatus
      tags: [businessDocuments]
      summary: Advance a business document status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessDocumentStatusInput"
      responses:
        "200":
          description: Updated business document status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocument"
        "400":
          description: Invalid status transition
        "401":
          description: Admin authentication required
        "404":
          description: Business document not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, brand, name, type, category, detail, color, mark, availability]
      properties:
        id:
          type: number
          format: integer
        brand:
          type: string
        name:
          type: string
        type:
          type: string
        category:
          type: string
        detail:
          type: string
        color:
          type: string
        mark:
          type: string
        availability:
          type: string
        imagePath:
          type: string
          nullable: true
    ProductInput:
      type: object
      required: [brand, name, type, category, detail, color, mark, availability]
      properties:
        brand:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        mark:
          type: string
          minLength: 1
          maxLength: 4
        availability:
          type: string
          minLength: 1
        imagePath:
          type: string
          nullable: true
    AboutPage:
      type: object
      required: [id, eyebrow, title, intro, segments]
      properties:
        id:
          type: number
          format: integer
        eyebrow:
          type: string
        title:
          type: string
        intro:
          type: string
        imagePath:
          type: string
          nullable: true
        segments:
          type: array
          items:
            $ref: "#/components/schemas/AboutSegment"
    AboutPageInput:
      type: object
      required: [eyebrow, title, intro]
      properties:
        eyebrow:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        intro:
          type: string
          minLength: 1
        imagePath:
          type: string
          nullable: true
    AboutSegment:
      type: object
      required: [id, eyebrow, title, body, imagePosition, sortOrder]
      properties:
        id:
          type: number
          format: integer
        eyebrow:
          type: string
        title:
          type: string
        body:
          type: string
        imagePath:
          type: string
          nullable: true
        imagePosition:
          type: string
          enum: [left, right]
        sortOrder:
          type: number
          format: integer
    AboutSegmentInput:
      type: object
      required: [eyebrow, title, body, imagePosition, sortOrder]
      properties:
        eyebrow:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        imagePath:
          type: string
          nullable: true
        imagePosition:
          type: string
          enum: [left, right]
        sortOrder:
          type: number
          format: integer
    DocumentBrandingImage:
      type: object
      required: [imagePath]
      properties:
        imagePath:
          type: string
    BusinessDocumentSettings:
      type: object
      required: [companyName, legalName, address, city, postalCode, country, phone, email, website, taxId, registrationNumber, currency, logoUrl, stampUrl, includeStampByDefault, brandColor, invoicePrefix, receiptPrefix, shippingPrefix, paymentInstructions, footerNote]
      properties:
        companyName: { type: string }
        legalName: { type: string }
        address: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }
        phone: { type: string }
        email: { type: string }
        website: { type: string }
        taxId: { type: string }
        registrationNumber: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        logoUrl: { type: string }
        stampUrl: { type: string }
        includeStampByDefault: { type: boolean }
        brandColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        invoicePrefix: { type: string, minLength: 1, maxLength: 12 }
        receiptPrefix: { type: string, minLength: 1, maxLength: 12 }
        shippingPrefix: { type: string, minLength: 1, maxLength: 12 }
        paymentInstructions: { type: string }
        footerNote: { type: string }
    BusinessDocumentSettingsInput:
      type: object
      required: [companyName, legalName, address, city, postalCode, country, phone, email, website, taxId, registrationNumber, currency, logoUrl, stampUrl, includeStampByDefault, brandColor, invoicePrefix, receiptPrefix, shippingPrefix, paymentInstructions, footerNote]
      properties:
        companyName: { type: string, minLength: 1, maxLength: 160 }
        legalName: { type: string, maxLength: 160 }
        address: { type: string, maxLength: 240 }
        city: { type: string, maxLength: 120 }
        postalCode: { type: string, maxLength: 32 }
        country: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 80 }
        email: { type: string, maxLength: 254 }
        website: { type: string, maxLength: 254 }
        taxId: { type: string, maxLength: 100 }
        registrationNumber: { type: string, maxLength: 100 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        logoUrl: { type: string, maxLength: 2048 }
        stampUrl: { type: string, maxLength: 2048 }
        includeStampByDefault: { type: boolean }
        brandColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        invoicePrefix: { type: string, minLength: 1, maxLength: 12 }
        receiptPrefix: { type: string, minLength: 1, maxLength: 12 }
        shippingPrefix: { type: string, minLength: 1, maxLength: 12 }
        paymentInstructions: { type: string, maxLength: 2000 }
        footerNote: { type: string, maxLength: 2000 }
    BusinessDocumentItemInput:
      type: object
      required: [description, quantity, unitPrice, taxRate]
      properties:
        description: { type: string, minLength: 1, maxLength: 240 }
        sku: { type: string, maxLength: 100 }
        quantity: { type: number, minimum: 0.01 }
        unitPrice: { type: number, minimum: 0 }
        taxRate: { type: number, minimum: 0, maximum: 100 }
    BusinessDocumentItem:
      type: object
      required: [description, sku, quantity, unitPrice, taxRate, lineTotal]
      properties:
        description: { type: string }
        sku: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        taxRate: { type: number }
        lineTotal: { type: number }
    BusinessDocumentInput:
      type: object
      required: [documentType, issueDate, customerName, customerAddress, items, currency, shippingAmount, notes, terms, carrier, service, trackingNumber, paymentMethod, includeStamp]
      properties:
        documentType: { type: string, enum: [invoice, receipt, shipping] }
        issueDate: { type: string }
        dueDate: { type: [string, "null"] }
        customerName: { type: string, minLength: 1, maxLength: 160 }
        customerCompany: { type: [string, "null"], maxLength: 160 }
        customerEmail: { type: [string, "null"], maxLength: 254 }
        customerPhone: { type: [string, "null"], maxLength: 80 }
        customerTaxId: { type: [string, "null"], maxLength: 100 }
        customerAddress: { type: string, maxLength: 1200 }
        shipToName: { type: [string, "null"], maxLength: 160 }
        shipToAddress: { type: [string, "null"], maxLength: 1200 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BusinessDocumentItemInput"
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        shippingAmount: { type: number, minimum: 0 }
        notes: { type: string, maxLength: 4000 }
        terms: { type: string, maxLength: 4000 }
        carrier: { type: string, maxLength: 120 }
        service: { type: string, maxLength: 120 }
        trackingNumber: { type: string, maxLength: 160 }
        shippingDate: { type: [string, "null"] }
        packageWeight: { type: ["number", "null"], minimum: 0 }
        packageLength: { type: ["number", "null"], minimum: 0 }
        packageWidth: { type: ["number", "null"], minimum: 0 }
        packageHeight: { type: ["number", "null"], minimum: 0 }
        paymentMethod: { type: string, maxLength: 120 }
        includeStamp: { type: boolean }
    BusinessDocumentStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [issued, paid, shipped, delivered, void] }
    BusinessDocument:
      type: object
      required: [id, number, documentType, status, issueDate, dueDate, customerName, customerCompany, customerEmail, customerPhone, customerTaxId, customerAddress, shipToName, shipToAddress, items, currency, subtotal, taxAmount, shippingAmount, total, notes, terms, carrier, service, trackingNumber, shippingDate, packageWeight, packageLength, packageWidth, packageHeight, paymentMethod, includeStamp, companySnapshot, createdAt, updatedAt]
      properties:
        id: { type: number, format: integer }
        number: { type: string }
        documentType: { type: string, enum: [invoice, receipt, shipping] }
        status: { type: string, enum: [draft, issued, paid, shipped, delivered, void] }
        issueDate: { type: string }
        dueDate: { type: [string, "null"] }
        customerName: { type: string }
        customerCompany: { type: [string, "null"] }
        customerEmail: { type: [string, "null"] }
        customerPhone: { type: [string, "null"] }
        customerTaxId: { type: [string, "null"] }
        customerAddress: { type: string }
        shipToName: { type: [string, "null"] }
        shipToAddress: { type: [string, "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/BusinessDocumentItem"
        currency: { type: string }
        subtotal: { type: number }
        taxAmount: { type: number }
        shippingAmount: { type: number }
        total: { type: number }
        notes: { type: string }
        terms: { type: string }
        carrier: { type: string }
        service: { type: string }
        trackingNumber: { type: string }
        shippingDate: { type: [string, "null"] }
        packageWeight: { type: ["number", "null"] }
        packageLength: { type: ["number", "null"] }
        packageWidth: { type: ["number", "null"] }
        packageHeight: { type: ["number", "null"] }
        paymentMethod: { type: string }
        includeStamp: { type: boolean }
        companySnapshot:
          $ref: "#/components/schemas/BusinessDocumentSettings"
        createdAt: { type: string }
        updatedAt: { type: string }

